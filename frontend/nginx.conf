# WebSocket은 HTTP에서 Upgrade되어 연결을 유지합니다. 두 헤더를 반드시 전달해야 합니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=socket_limit:10m rate=2r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    # 익명 사용자의 원본 IP를 기본 access log에 장기 보관하지 않습니다.
    access_log off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /ws/ {
        limit_req zone=socket_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 75s;
    }
    location / {
        # /posts/1을 직접 열어도 Vue Router가 해당 화면을 렌더링할 수 있습니다.
        try_files $uri $uri/ /index.html;
    }
}
